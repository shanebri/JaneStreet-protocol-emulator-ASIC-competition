name: Packed streaming
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install -r test/requirements.txt
      - name: Host, transport and codec contracts
        run: |
          python -B -m unittest discover -s test -p test_streaming_host.py -v
          python -B -m unittest discover -s test -p test_streaming_transport.py -v
          python -B -m unittest discover -s test -p test_usb_ls_tools.py -v
          python -B -m unittest discover -s test -p test_feeder_tools.py -v
      - name: Packed streaming pins
        run: python -B tools/streaming/run_sim.py --out test/sim_build/streaming-ci
      - name: USB digital timing prototype
        run: python -B tools/streaming/run_sim.py --module test_usb_ls_tx --out test/sim_build/usb-symbol-ci
      - name: USB low-speed SETUP and ACK
        run: |
          mkdir -p test/sim_build
          iverilog -g2012 -s usb_ls_setup_ack_tb -o test/sim_build/usb-setup-ack.vvp fpga/usb_ls_setup_ack.sv test/usb_ls_setup_ack_tb.sv
          vvp test/sim_build/usb-setup-ack.vvp
      - name: Autonomous feeder ownership and dual-engine arbitration
        run: |
          python -B tools/streaming/run_sim.py --module test_packet_feeder --out test/sim_build/feeder-ci
          python -B tools/streaming/run_sim.py --module test_packet_feeder_bank --out test/sim_build/feeder-bank-ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: streaming-results
          path: |
            test/sim_build/streaming-ci/receipt.json
            test/sim_build/streaming-ci/results.xml
            test/sim_build/usb-symbol-ci/receipt.json
            test/sim_build/usb-symbol-ci/results.xml
            test/sim_build/usb-symbol-ci/measurements.json
            test/sim_build/feeder-ci/**
            test/sim_build/feeder-bank-ci/**
